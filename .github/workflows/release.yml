name: Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build universal macOS binaries
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Test native backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build universal app and disk image
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg --no-sign -- --locked

      - name: Verify architectures and package app
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Deja.app
          lipo "$app/Contents/MacOS/deja" -verify_arch arm64 x86_64
          mkdir release
          ditto -c -k --sequesterRsrc --keepParent "$app" release/Deja_universal.app.zip
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release/

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-universal
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS binaries
        uses: actions/download-artifact@v8.0.2
        with:
          name: macos-universal
          path: release

      - name: Publish release assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Deja ${{ github.ref_name }}
          generate_release_notes: true
          body: Universal macOS binaries for Apple Silicon and Intel. These builds are unsigned and not notarized.
          files: release/*
          fail_on_unmatched_files: true
