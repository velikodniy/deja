[package]
name = "deja"
version = "0.1.0"
description = "A simple DjVu viewer"
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "deja_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
djvu-rs = { version = "0.32", features = ["parallel"] }
png = "0.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
